name: Diagnostico (temporal)

# Workflow temporal para diagnosticar rojos: corre cada archivo de pruebas en su propio job y publica
# cada fallo como anotacion (reporter "github"). Se borra antes de entregar.
on:
  push:
    branches: [lab-automatizacion]
  workflow_dispatch:

jobs:
  diag:
    name: ${{ matrix.archivo }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        archivo: [04-checkout, heredados, zz-diag-h3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Ejecutar ${{ matrix.archivo }}
        run: npx playwright test ${{ matrix.archivo }} --retries=0 --reporter=github,list ${{ matrix.archivo == 'zz-diag-h3' && '--repeat-each=30' || '' }}
