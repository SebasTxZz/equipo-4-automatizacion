name: Pruebas automatizadas

# Cada vez que hacen push (o abren un pull request), GitHub ejecuta la suite completa en una máquina limpia.
# Si un test falla, el commit se marca con una X roja. También se puede lanzar a mano desde la pestaña Actions.
# En la rama main, además, se publica el reporte HTML en GitHub Pages (ver el job "publicar-reporte").
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright · Chromium
    # Versión fija del sistema (no "ubuntu-latest"): así la suite no cambia de entorno sin avisar.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar el navegador
        run: npx playwright install --with-deps chromium

      - name: Ejecutar las pruebas
        run: npx playwright test

      # El reporte HTML se guarda siempre (incluso si fallan pruebas) para poder descargarlo y abrirlo.
      - name: Guardar el reporte
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: reporte-playwright
          path: playwright-report/
          retention-days: 14

      # Solo en main: empaqueta el mismo reporte para publicarlo como página web.
      - name: Preparar el reporte para GitHub Pages
        uses: actions/upload-pages-artifact@v4
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        with:
          path: playwright-report/

  publicar-reporte:
    name: Publicar reporte en GitHub Pages
    needs: e2e
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Si GitHub Pages aún no está activado (Settings → Pages → Source: GitHub Actions), no hay dónde publicar:
      # el job termina en verde sin hacer nada. Al activarlo, el siguiente push a main publica el reporte.
      - name: Comprobar si GitHub Pages está activado
        id: estado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --silent 2>/dev/null; then
            echo "habilitado=true" >> "$GITHUB_OUTPUT"
          else
            echo "habilitado=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages no está activado: se omite la publicación del reporte."
          fi

      - name: Publicar
        id: deployment
        if: ${{ steps.estado.outputs.habilitado == 'true' }}
        uses: actions/deploy-pages@v4
